name: Build Windows Application

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 pyttsx3
          pip install .

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --clean --noconfirm windows/TodoBird.spec

      - name: Build Windows Setup Wizard with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer.iss

      - name: Archive Portable Release
        run: |
          Compress-Archive -Path dist/TodoBird -DestinationPath dist/TodoBird-Portable-x64.zip

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TodoBird-Windows-Installer
          path: windows/dist/TodoBird-Setup-*.exe

      - name: Upload Portable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TodoBird-Windows-Portable
          path: dist/TodoBird-Portable-x64.zip
