name: todo-bird
base: core24
version: '1.0.1'
summary: Offline Desktop Personal Assistant & Task Manager
description: |
  TODO BIRD is an offline desktop personal assistant, interactive Gantt scheduler,
  and task manager designed for privacy, focus, and local-first productivity.

  Key Features:
  - Interactive WBS and Gantt scheduling engine
  - Comprehensive task and subtask status workflow
  - Local-first SQLite storage for complete privacy and data sovereignty
  - Avocet voice companion with local-time aware greetings
  - Dark and light modern neumorphic themes

grade: stable
confinement: strict
license: Proprietary

apps:
  todo-bird:
    command: bin/todo-bird
    extensions: [gnome]
    desktop: gui/todo-bird.desktop
    common-id: todo-bird.desktop
    plugs:
      - home
      - network
      - network-bind
      - audio-playback
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - opengl
    environment:
      TODO_BIRD_RUNTIME_MODE: packaged
      TODO_BIRD_APP_DATA_DIR: $SNAP_USER_COMMON
      PYTHONPATH: $SNAP:$SNAP/lib/python3.12/site-packages:$PYTHONPATH
      QT_QPA_PLATFORMTHEME: gtk3
      QT_PLUGIN_PATH: $SNAP/lib/python3.12/site-packages/PySide6/Qt/plugins

parts:
  todo-bird:
    plugin: python
    source: .
    python-requirements:
      - todo_bird_app/requirements.txt
    stage-packages:
      - libgl1
      - libegl1
      - libxkbcommon0
      - libpulse0
      - libasound2t64
      - libdbus-1-3
      - speech-dispatcher
      - espeak-ng
    stage:
      - -lib/python3.12/site-packages/todo_bird_app/data
      - -lib/python3.12/site-packages/todo_bird_app/config
      - -lib/python3.12/site-packages/todo_bird_app/logs
      - -*.db*
    prime:
      - -lib/python3.12/site-packages/todo_bird_app/data
      - -lib/python3.12/site-packages/todo_bird_app/config
      - -lib/python3.12/site-packages/todo_bird_app/logs
      - -*.db*



  assets:
    plugin: dump
    source: .
    stage:
      - voice/*
      - assets/*
